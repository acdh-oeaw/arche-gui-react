name: Build and deploy

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-build-deploy"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_call:
  workflow_dispatch:

jobs:
  env:
    name: Generate environment variables
    runs-on: ubuntu-24.04
    steps:
      - name: Derive environment from git ref
        id: environment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENVIRONMENT="production"
            APP_NAME_SUFFIX=""
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            ENVIRONMENT="dev"
            APP_NAME_SUFFIX="-dev"
          elif [ "${{github.event_name}}" = "pull_request" ]; then
            ENVIRONMENT="pr/${{ github.event.pull_request.number }}"
            APP_NAME_SUFFIX="-pr-${{ github.event.pull_request.number }}"
          else
            exit 1
          fi

          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "APP_NAME_SUFFIX=$APP_NAME_SUFFIX" >> $GITHUB_OUTPUT
    outputs:
      environment: "${{ steps.environment.outputs.ENVIRONMENT }}"
      app_name: "frontend${{ steps.environment.outputs.APP_NAME_SUFFIX }}"
      registry: "ghcr.io"
      image: "${{ github.repository }}"

  vars:
    name: Generate public url
    needs: [env]
    runs-on: ubuntu-24.04
    environment:
      name: "${{ needs.env.outputs.environment }}"
    steps:
      - name: Generate public URL
        id: public_url
        run: |
          if [ -z "${{ vars.PUBLIC_URL }}" ]; then
            PUBLIC_URL="https://${{ needs.env.outputs.app_name }}.${{ vars.KUBE_INGRESS_BASE_DOMAIN }}"
          else
            PUBLIC_URL="${{ vars.PUBLIC_URL }}"
          fi

          echo "PUBLIC_URL=$PUBLIC_URL" >> $GITHUB_OUTPUT
    outputs:
      public_url: "${{ steps.public_url.outputs.PUBLIC_URL }}"

  build:
    name: Build and push docker image
    needs: [env, vars]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    environment:
      name: "${{ needs.env.outputs.environment }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: "${{ needs.env.outputs.registry }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: "${{ needs.env.outputs.registry }}/${{ needs.env.outputs.image }}"
          tags: |
            type=raw,value={{sha}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          build-args: |
            "NEXT_PUBLIC_APP_BASE_URL=${{ needs.vars.outputs.public_url }}"
            "NEXT_PUBLIC_BOTS=${{ vars.NEXT_PUBLIC_BOTS }}"
            "NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}"
            "NEXT_PUBLIC_IMPRINT_SERVICE_BASE_URL=${{ vars.NEXT_PUBLIC_IMPRINT_SERVICE_BASE_URL }}"
            "NEXT_PUBLIC_MATOMO_BASE_URL=${{ vars.NEXT_PUBLIC_MATOMO_BASE_URL }}"
            "NEXT_PUBLIC_MATOMO_ID=${{ vars.NEXT_PUBLIC_MATOMO_ID }}"
            "NEXT_PUBLIC_REDMINE_ID=${{ vars.SERVICE_ID }}"
            "NEXT_PUBLIC_ARCHE_SYMFONY_API=${{ vars.NEXT_PUBLIC_ARCHE_SYMFONY_API }}"
            "NEXT_PUBLIC_ARCHE_CITATION_URL=${{ vars.NEXT_PUBLIC_ARCHE_CITATION_URL }}"
            "NEXT_PUBLIC_ARCHE_IIIF_URL=${{ vars.NEXT_PUBLIC_ARCHE_IIIF_URL }}"
            "NEXT_PUBLIC_ARCHE_CORE_API=${{ vars.NEXT_PUBLIC_ARCHE_CORE_API }}"
            "NEXT_PUBLIC_STATIC_CONTENT_PAGES=${{ vars.NEXT_PUBLIC_STATIC_CONTENT_PAGES }}"
            "NEXT_PUBLIC_GITHUB_STATIC_URL=${{ vars.NEXT_PUBLIC_GITHUB_STATIC_URL }}"
            "NEXT_PUBLIC_ARCHE_THUMBNAIL_URL=${{ vars.NEXT_PUBLIC_ARCHE_THUMBNAIL_URL }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy docker image
    needs: [env, vars, build]
    uses: acdh-oeaw/gl-autodevops-minimal-port/.github/workflows/deploy.yml@main
    secrets: inherit
    with:
      environment: "${{ needs.env.outputs.environment }}"
      DOCKER_TAG: "${{ needs.env.outputs.registry }}/${{ needs.env.outputs.image }}"
      APP_NAME: "${{ needs.env.outputs.app_name }}"
      APP_ROOT: "/"
      SERVICE_ID: "${{ vars.SERVICE_ID }}"
      PUBLIC_URL: "${{ needs.vars.outputs.public_url }}"
      default_port: "3000"

  static-content:
    name: Generate static content
    needs: [vars, deploy]
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for the app to respond
        run: |
          for attempt in $(seq 1 30); do
            if curl -sfL -o /dev/null --max-time 10 "${{ needs.vars.outputs.public_url }}/browser/"; then
              echo "App is responding after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}/30: app is not responding yet, retrying in 10s."
            sleep 10
          done
          echo "::error::App did not start responding within 5 minutes."
          exit 1

      - name: Regenerate static content
        run: |
          response=$(curl -sS --max-time 300 "${{ needs.vars.outputs.public_url }}/browser/api/static-content")
          echo "$response" | jq .

          if [ "$(echo "$response" | jq -r '.ok')" != "true" ]; then
            echo "$response" | jq -r '.failed[] | "::error::\(.page) [\(.lang)]: \(.error)"'
            exit 1
          fi

          echo "Generated $(echo "$response" | jq -r '.updated | length') page(s)."
